<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
            background-color: rgba(172, 215, 218, 0.444);
            border: 2px solid black;
        }
        * {
            margin: 0px;
            padding: 0px;
        }

        .box {
            border: 2px solid black;
            height: 150px;
            width: 90vw;
            padding: 3px;
            margin: 4px;
        }

        .box1 {
            background-color: orange;
            border-radius: 20px;

        }

        .box2 {
            background-color: whitesmoke;
            border-radius: 20px;
            position: relative;
            top: -4px;

        }

        .box3 {
            background-color: green;
            border-radius: 20px;
            position: relative;
            top: -8px;
        }

        .box2 img {
            width: 183px;
            height: 114px;
            position: relative;
            left: 242px;
            top: 19px;
            /* display: flex;
            align-items: center;
            justify-content: center; */
        }
    </style>
</head>

<body>
    <div class="box box1"></div>
    <div class="box box2">
        <img src="https://cdn.pixabay.com/photo/2023/06/23/17/47/ashok-chakra-8083914_1280.png" alt="chakra">
    </div>
    <div class="box box3"></div>

</body>

</html>
