<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            margin: 0px;
            padding: 0px;
        }
        .box {
            border: 2px solid black;
            height: 133px;
            width: 80vw;
            margin: 3px;
            padding: 2px;
        }
/* 
in absolute position the box will move according there parents potion  */


        .box1 {
            background-color: red;
            position: absolute;
            top: 0px;
            left: 20px;
            z-index: 1;
         
        }

        .box2 {
            background-color: green;

        }

        .box3 {
            background-color: blue;
        }

        .box4 {
            background-color: yellow;
        }

        .parent {
            border: 2px solid black;
          /* agr ham kisi properties ka use kr kte hn parents ke andr like postion transform etc tab bhi position apply krne ke bad box apne apne parents ke himralative rahe ga htnl ya body ke relative nhi rahe ga */
          margin: 43px;
          padding: 34px;
          position: absolute;
          
          /* transform: translate(0); */
          /* filter: invert(); */
          /* perspective: 0cm; */
           
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
