<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fixed</title>
</head>
<style>
    * {
        margin: 0px;
        padding: 0px;
    }

    .box {
        border: 2px solid black;
        width: 80vw;
        height: 133px;
        margin: 43px;
        padding: 33px;
    }

    .box1 {
        background-color: aqua;
    }

    .box2 {
        background-color: yellowgreen;
    }

    .box3

    /* in fixed position the box will we fixed at the page and the box will not move after the scrolling page  */
        {
        background-color: rgb(34, 21, 63);
        position: fixed;
        top: 0px;
        left: 25vw;
        width: 356px;
        height: 31px;

    }
</style>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
    </div>
</body>

</html>
