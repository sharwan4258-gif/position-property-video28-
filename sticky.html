<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fixed</title>
</head>
<style>
    * {
        margin: 0px;
        padding: 0px;
    }

    .box {
        border: 2px solid black;
        width: 80vw;
        height: 133px;
        margin: 43px;
        padding: 33px;
    }
/* sticy position se ham box ko ak jagah chipka deta hn or sroll krte krte smaye ye ak jagah sticy rehti hn or ye ham ise as ak nav bar me use kr sakte hnn */
    .box1 {
        background-color: rgb(34, 21, 63);
        position: sticky;
        top: 0px;
        left: 25vw;
        width: 100%;
        height: 111px;
        margin: 0px;
        padding: 0px;
    }

    .box3 {
        background-color: rgb(80, 214, 145);
    }

    .box2

    
        {
        background-color: wheat;

    }

    .box4 {
        background-color: greenyellow;
    }

    .box5 {
        background-color: rgb(50, 143, 205);
    }

    .box6 {
        background-color: rgb(226, 34, 178);
    }

    .box7 {
        background-color: rgb(220, 141, 13);
    }
</style>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
        <div class="box box5"></div>
        <div class="box box6"></div>
        <div class="box box7"></div>
    </div>
</body>

</html>
